[project]
name = "chinese-default-migration"
description = "Anki decks to switch Brave, Linux, Android and iPhone to Chinese"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "babel>=2.18.0",
    "edge-tts>=7.2.8",
    "genanki>=0.13.1",
    "jieba>=0.42.1",
    "pypinyin>=0.55.0",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "anki>=26.9.3",
]
